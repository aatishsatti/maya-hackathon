# Render Blueprint: Maya on a PAID web service (plan 1c-2g: 1 CPU, 2 GB) with a persistent disk. No secret is in this file: the keys are asked for in the Render dashboard
# (sync: false) and live only in Render's server environment, never in the browser or in git.
# Plan ids are from Render's Blueprint spec (free, 0.5c-512mb, 1c-2g ...). "plan" is spelled out so a re-sync cannot move the service to another plan.
# The disk keeps ONLY what is under its mount path (Render: "Only filesystem changes under your disk's mount path are preserved across deploys and restarts"), so every
# Maya data directory is pointed at /var/data below (the code already reads these four variables). A service with a disk cannot scale to more than one instance and has no
# zero-downtime deploys: a deploy restarts the service for a moment. Disk size can be increased later, never decreased.
services:
  - type: web
    name: maya
    runtime: node
    plan: 1c-2g
    disk:
      name: maya-data
      mountPath: /var/data
      sizeGB: 1
    branch: render-test
    autoDeploy: false
    buildCommand: >-
      python3 -m venv .venv-mms &&
      .venv-mms/bin/pip install --quiet --upgrade pip &&
      .venv-mms/bin/pip install --quiet numpy==2.0.2 transformers==4.57.6 &&
      .venv-mms/bin/pip install --quiet torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu &&
      HF_HOME=.hf-cache .venv-mms/bin/python -c "from transformers import VitsModel, AutoTokenizer; VitsModel.from_pretrained('facebook/mms-tts-eng'); AutoTokenizer.from_pretrained('facebook/mms-tts-eng')" &&
      npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: MAYA_MMS_PYTHON
        value: .venv-mms/bin/python
      - key: HF_HOME
        value: .hf-cache
      - key: NODE_VERSION
        value: "22"
      - key: META_MODE
        value: real
      - key: MAYA_DATA_DIR
        value: /var/data/profiles
      - key: MAYA_CARE_DIR
        value: /var/data/care
      - key: MAYA_WA_DIR
        value: /var/data/whatsapp
      - key: MAYA_MEDIA_DIR
        value: /var/data/media
      - key: META_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
